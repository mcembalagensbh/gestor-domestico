or')}}function abrirModal(titulo,icone,conteudo){const modalContent=document.getElementById('modalContent');modalContent.innerHTML=`<div class="modal-header"><div class="modal-title"><i class="fas ${icone}"></i> ${titulo}</div><button class="close-modal" onclick="fecharModal()">&times;</button></div><div class="modal-body">${conteudo}</div>`;document.getElementById('modalOverlay').style.display='flex';App.modalHasChanges=false}function fecharModal(){document.getElementById('modalOverlay').style.display='none';App.modalHasChanges=false}function confirmarExclusao(id,tipo,isRecorrente,regraId='',dia=0,mes=0,ano=0,isIndividual=false,individualId=''){if(isIndividual){if(confirm('Tem certeza que deseja excluir esta ocorrência específica do evento?')){deletarItem(id,tipo,'individual',regraId,dia,mes,ano,individualId)}return}if(!isRecorrente){if(confirm('Tem certeza que deseja excluir este item?')){deletarItem(id,tipo,'unico',regraId,dia,mes,ano)}return}App.pendingDelete={id,tipo,regraId,dia,mes,ano,individualId};const conteudo=`<p style="margin-bottom:16px">Este item é recorrente. Como deseja excluir?</p><div class="delete-option" onclick="selecionarOpcaoExclusao('unico')"><strong><i class="fas fa-times-circle"></i> Excluir apenas esta ocorrência</strong><div class="delete-confirm-text">Exclui apenas este item específico, mantendo as futuras ocorrências</div></div><div class="delete-option" onclick="selecionarOpcaoExclusao('futuro')"><strong><i class="fas fa-forward"></i> Excluir desta data em diante</strong><div class="delete-confirm-text">Exclui este e todos os itens futuros desta recorrência</div></div><div class="delete-option warning" onclick="selecionarOpcaoExclusao('todas')"><strong><i class="fas fa-ban"></i> Excluir todas as ocorrências</strong><div class="delete-confirm-text delete-highlight">Exclui permanentemente a regra e todas as suas ocorrências</div></div><div class="btn-group" style="margin-top:20px"><button class="btn" onclick="fecharModal()" style="backgr lendar"></i> Ano</label><input type="number" id="editGastoAno" class="form-input" value="${gasto.ano||''}"></div></div><div class="form-group"><label class="form-label"><i class="fas fa-tags"></i> Categoria</label><select id="editGastoCategoria" class="form-select">${categorias}</select></div><div class="btn-group" style="margin-top:20px"><button class="btn btn-gasto" onclick="salvarEdicaoGasto('${gasto.id}')" style="flex:2"><i class="fas fa-save"></i> Salvar</button><button class="btn" onclick="fecharModal()" style="flex:1;background:var(--gray);color:#fff">Cancelar</button></div>`;abrirModal('Editar Gasto','fa-edit',conteudo)}async function salvarEdicaoGasto(id){const descricao=document.getElementById('editGastoDescricao')?.value.trim();const valor=parseCurrency(document.getElementById('editGastoValor')?.value);const dia=parseInt(document.getElementById('editGastoDia')?.value);const mes=parseInt(document.getElementById('editGastoMes')?.value);const ano=parseInt(document.getElementById('editGastoAno')?.value);const categoria=document.getElementById('editGastoCategoria')?.value;if(!descricao||!valor||!dia||!mes||!ano){showToast('Preencha todos os campos','warning');return}const gastoOriginal=App.dataCache.gastos.find(g=>g.id===id);const diasNoMes=getDiasNoMes(ano,mes);const diaAjustado=Math.min(dia,diasNoMes);const data=`${ano}-${String(mes).padStart(2,'0')}-${String(diaAjustado).padStart(2,'0')}`;try{await App.supabase.from('gastos').update({descricao:descricao,valor:valor,categoria:categoria||'outros',dia:diaAjustado,mes:mes,ano:ano,data:data}).eq('id',id);if(gastoOriginal?.valor!==valor&&App.saldoCentral.id){const diferenca=gastoOriginal.valor-valor;if(diferenca!==0){const{data:saldoAtual}=await App.supabase.from('saldos').select('valor').eq('id',App.saldoCentral.id).single();if(saldoAtual){const novoValor=saldoAtual.valor+diferenca;await App.supabase.from('saldos').update({valor:novoValor}).eq('id',App.saldoCentral.id);App.saldoCentral.valor=novoValor;atualizarSaldoHeader()}}}await registrarHistorico('edicao_gasto',`Gasto editado: ${descricao}`,{id,descricao_anterior:gastoOriginal?.descricao,descricao_nova:descricao,valor_anterior:gastoOriginal?.valor,valor_novo:valor,categoria_anterior:gastoOriginal?.categoria,categoria_nova:categoria,dia_anterior:gastoOriginal?.dia,dia_novo:diaAjustado,mes_anterior:gastoOriginal?.mes,mes_novo:mes,ano_anterior:gastoOriginal?.ano,ano_novo:ano});showToast('Gasto atualizado com sucesso!','success');fecharModal();await carregarDados(true);await atualizarCalendario();mostrarConteudo()}catch(error){console.error('Erro ao atualizar gasto:',error);showToast('Erro ao atualizar gasto: '+error.message,'error')}}function abrirMenuSeguranca(){const conteudo=`<div class="form-group"><label class="form-label"><i class="fas fa-lock"></i> Senha Atual (Acesso)</label><input type="password" id="senhaAtualAcesso" class="form-input" placeholder="Digite a senha atual do acesso"></div><div class="form-group"><label class="form-label"><i class="fas fa-key"></i> Nova Senha (Acesso)</label><input type="password" id="novaSenhaAcesso" class="form-input" placeholder="Digite a nova senha (mínimo 6 dígitos)"></div><div class="form-group"><label class="form-label"><i class="fas fa-check-circle"></i> Confirmar Nova Senha (Acesso)</label><input type="password" id="confirmarSenhaAcesso" class="form-input" placeholder="Confirme a nova senha"></div><hr style="margin:20px 0;border-color:#eee"><div class="form-group"><label class="form-label"><i class="fas fa-lock"></i> Senha Atual (Saldo)</label><input type="password" id="senhaAtualSaldo" class="form-input" placeholder="Digite a senha atual do saldo"></div><div class="form-group"><label class="form-label"><i class="fas fa-key"></i> Nova Senha (Saldo)</label><input type="password" id="novaSenhaSaldo" class="form-input" placeholder="Digite a nova senha (4 dígitos)"></div><div class="form-group"><label class="form-label"><i class="fas fa-check-circle"></i> Confirmar Nova Senha (Saldo)</label><input type="password" id="confirmarSenhaSaldo" class="form-input" placeholder="Confirme a nova senha"></div><div class="btn-group" style="margin-top:20px"><button class="btn btn-primary" onclick="alterarSenhaAcesso()" style="flex:1"><i class="fas fa-save"></i> Alterar Senha de Acesso</button><button class="btn btn-warning" onclick="alterarSenhaSaldo()" style="flex:1"><i class="fas fa-wallet"></i> Alterar Senha do Saldo</button></div><div class="btn-group" style="margin-top:10px"><button class="btn" onclick="fecharModal()" style="flex:1;background:var(--gray);color:#fff">Cancelar</button></div>`;abrirModal('Segurança','fa-shield-alt',conteudo)}async function alterarSenhaAcesso(){const senhaAtual=document.getElementById('senhaAtualAcesso')?.value;const novaSenha=document.getElementById('novaSenhaAcesso')?.value;const confirmarSenha=document.getElementById('confirmarSenhaAcesso')?.value;if(!senhaAtual||!novaSenha||!confirmarSenha){showToast('Preencha todos os campos','warning');return}if(novaSenha!==confirmarSenha){showToast('As novas senhas não coincidem','warning');return}if(novaSenha.length<6){showToast('A nova senha deve ter no mínimo 6 caracteres','warning');return}try{const{error}=await App.supabase.auth.updateUser({password:novaSenha});if(error)throw error;await registrarHistorico('seguranca','Alteração de senha de acesso',{});showToast('Senha de acesso alterada com sucesso!','success');fecharModal()}catch(error){console.error('Erro ao alterar senha:',error);showToast('Erro ao alterar senha: '+error.message,'error')}}async function alterarSenhaSaldo(){const senhaAtual=document.getElementById('senhaAtualSaldo')?.value;const novaSenha=document.getElementById('novaSenhaSaldo')?.value;const confirmarSenha=document.getElementById('confirmarSenhaSaldo')?.value;if(!senhaAtual||!novaSenha||!confirmarSenha){showToast('Preencha todos os campos','warning');return}if(novaSenha!==confirmarSenha){showToast('As novas senhas não coincidem','warning');return}if(novaSenha.length!==4||isNaN(novaSenha)){showToast('A senha do saldo deve ter 4 dígitos numéricos','warning');return}if(senhaAtual!==App.saldoSenha){showToast('Senha atual do saldo incorreta','error');return}try{await App.supabase.from('configuracoes').upsert({user_id:App.currentUser.id,chave:'saldo_senha',valor:novaSenha},{onConflict:'user_id,chave'});App.saldoSenha=novaSenha;await registrarHistorico('seguranca','Alteração de senha do saldo',{});showToast('Senha do saldo alterada com sucesso!','success');fecharModal()}catch(error){console.error('Erro ao alterar senha do saldo:',error);showToast('Erro ao alterar senha do saldo: '+error.message,'error')}}function abrirMenuRelatorio(){let relatorioHtml='<div class="items-list" style="max-height:60vh;overflow-y:auto">';if(App.historicoAcoes.length===0){relatorioHtml+='<div class="empty-state"><i class="fas fa-history"></i><p>Nenhuma ação registrada ainda</p></div>'}else{relatorioHtml+='<div style="padding:10px;background:#f8f9fa;margin-bottom:10px;border-radius:4px;text-align:center"><strong>Total de ações: '+App.historicoAcoes.length+'</strong></div>';App.historicoAcoes.slice(0,50).forEach((acao,index)=>{const data=new Date(acao.data).toLocaleString('pt-BR');let cor='var(--purple)';let detalhesExtra='';if(acao.tipo.includes('pagamento'))cor='var(--success)';if(acao.tipo.includes('exclusao'))cor='var(--danger)';if(acao.tipo.includes('edicao'))cor='var(--warning)';if(acao.detalhes){if(acao.detalhes.valor_original&&acao.detalhes.valor_pago){detalhesExtra=`<div style="font-size:10px;color:#666">💰 Original: ${formatCurrency(acao.detalhes.valor_original)} | Pago: ${formatCurrency(acao.detalhes.valor_pago)}</div>`}else if(acao.detalhes.valor_anterior&&acao.detalhes.valor_novo){detalhesExtra=`<div style="font-size:10px;color:#666">💰 Antes: ${formatCurrency(acao.detalhes.valor_anterior)} | Depois: ${formatCurrency(acao.detalhes.valor_novo)}</div>`}else if(acao.detalhes.titulo_anterior&&acao.detalhes.titulo_novo){detalhesExtra=`<div style="font-size:10px;color:#666">📝 "${acao.detalhes.titulo_anterior}" → "${acao.detalhes.titulo_novo}"</div>`}else if(acao.detalhes.descricao_anterior&&acao.detalhes.descricao_nova){detalhesExtra=`<div style="font-size:10px;color:#666">📝 "${acao.detalhes.descricao_anterior}" → "${acao.detalhes.descricao_nova}"</div>`}else if(acao.detalhes.hora_anterior&&acao.detalhes.hora_nova){detalhesExtra=`<div style="font-size:10px;color:#666">⏰ ${acao.detalhes.hora_anterior||'vazio'} → ${acao.detalhes.hora_nova||'vazio'}</div>`}else if(acao.detalhes.local_anterior&&acao.detalhes.local_novo){detalhesExtra=`<div style="font-size:10px;color:#666">📍 ${acao.detalhes.local_anterior||'vazio'} → ${acao.detalhes.local_novo||'vazio'}</div>`}else if(acao.detalhes.valor){detalhesExtra=`<div style="font-size:10px;color:#666">💰 Valor: ${formatCurrency(acao.detalhes.valor)}</div>`}else if(acao.detalhes.quantidade){detalhesExtra=`<div style="font-size:10px;color:#666">📦 Quantidade: ${acao.detalhes.quantidade}x</div>`}}relatorioHtml+=`<div class="item-card" style="border-left-color:${cor}"><div class="item-info"><div class="item-title"><i class="fas ${acao.tipo.includes('criacao')?'fa-plus-circle':acao.tipo.includes('pagamento')?'fa-check-circle':acao.tipo.includes('exclusao')?'fa-trash':acao.tipo.includes('edicao')?'fa-edit':'fa-history'}"></i> ${acao.descricao}</div><div class="item-details">${data} • ${acao.usuario}</div>${detalhesExtra}</div></div>`})}relatorioHtml+='</div><div class="btn-group" style="margin-top:20px"><button class="btn" onclick="fecharModal()" style="flex:1;background:var(--gray);color:#fff">Fechar</button></div>';abrirModal('Últimas 50 Ações','fa-history',relatorioHtml)}function abrirMenuPosicaoFab(){const posicoes=CONFIG.posicoesFab.map((p,index)=>`<div class="fab-pos-option" onclick="selecionarPosicaoFab(${index})"><i class="fas ${p.icon}"></i><div>${p.nome}</div></div>`).join('');const conteudo=`<p style="margin-bottom:15px">Escolha a posição do botão flutuante:</ ientY-fab.offsetTop;fab.style.transition='none'}});document.addEventListener('touchmove',(e)=>{if(isDragging){e.preventDefault();const touch=e.touches[0];const x=touch.clientX-offsetX;const y=touch.clientY-offsetY;const maxX=window.innerWidth-fab.offsetWidth;const maxY=window.innerHeight-fab.offsetHeight;fab.style.left=Math.min(Math.max(0,x),maxX)+'px';fab.style.top=Math.min(Math.max(0,y),maxY)+'px';fab.style.right='auto';fab.style.bottom='auto'}});document.addEventListener('touchend',()=>{if(isDragging){isDragging=false;fab.style.transition=''}})}async function init(){try{console.log('Inicializando...');if(!CONFIG.supabase.url||!CONFIG.supabase.anonKey){showToast('Erro: Configuração do Supabase incompleta','error');return}App.supabase=window.supabase.createClient(CONFIG.supabase.url,CONFIG.supabase.anonKey);console.log('Cliente Supabase criado');const{data:{session},error:sessionError}=await App.supabase.auth.getSession();if(sessionError){console.error('Erro ao obter sessão:',sessionError);showToast('Erro ao conectar com o servidor','error');document.getElementById('authContainer').style.display='flex';return}if(session){console.log('Usuário logado:',session.user.email);App.currentUser=session.user;document.getElementById('authContainer').style.display='none';document.getElementById('mainContainer').style.display='block';carregarPosicaoFab();await carregarDados();await atualizarCalendario();await mostrarConteudo()}else{console.log('Nenhum usuário logado');document.getElementById('authContainer').style.display='flex'}document.getElementById('btnLogin').addEventListener('click',async()=>{const email=document.getElementById('loginEmail').value.trim();const password=document.getElementById('loginPassword').value;if(!email||!password){showToast('Preencha email e senha','warning');return}try{const{data,error}=await App.supabase.auth.signInWithPassword({email,password});if(error){showToast(error.message||'Erro ao fazer login','error')}else{App.currentUser=data.user;document.getElementById('authContainer').style.display='none';document.getElementById('mainContainer').style.display='block';await carregarDados();await atualizarCalendario();await mostrarConteudo();showToast('Login realizado com sucesso!','success')}}catch(error){console.error('Erro inesperado no login:',error);showToast('Erro ao conectar com o servidor','error')}});document.getElementById('btnRegister').addEventListener('click',async()=>{const email=document.getElementById('registerEmail').value.trim();const password=document.getElementById('registerPassword').value;if(!email||!password){showToast('Preencha email e senha','warning');return}if(password.length<6){showToast('A senha deve ter no mínimo 6 caracteres','warning');return}try{const{error}=await App.supabase.auth.signUp({email,password});if(error){showToast(error.message||'Erro ao criar conta','error')}else{showToast('Conta criada! Faça login.','success');document.getElementById('registerForm').style.display='none';document.getElementById('loginForm').style.display='block'}}catch(error){console.error('Erro inesperado no registro:',error);showToast('Erro ao conectar com o servidor','error')}});document.getElementById('btnLogout').addEventListener('click',async()=>{await App.supabase.auth.signOut();App.currentUser=null;App.saldoAutenticado=false;document.getElementById('authContainer').style.display='flex';document.getElementById('mainContainer').style.display='none';showToast('Até logo!','info')});document.getElementById('btnHistorico').addEventListener('click',abrirHistoricoAcoes);document.getElementById('linkRegister').addEventListener('click',()=>{document.getElementById('loginForm').style.display='none';document.getElementById('registerForm').style.display='block'});document.getElementById('linkLogin').addEventListener('click',()=>{document.getElementById('registerForm').style.display='none';document.getElementById('loginForm').style.display='block'});document.getElementById('btnToday').addEventListener('click',()=>{const hoje=new Date();App.currentMonthOffset=0;App.selectedDay=hoje.getDate();atualizarCalendario();mostrarConteudo()});document.getElementById('btnPrevMonth').addEventListener('click',()=>{App.currentMonthOffset--;App.selectedDay=null;atualizarCalendario();mostrarConteudo()});document.getElementById('btnNextMonth').addEventListener('click',()=>{App.currentMonthOffset++;App.selectedDay=null;atualizarCalendario();mostrarConteudo()});document.getElementById('btnSaldoHeader').addEventListener('click',()=>{autenticarSaldos()});document.getElementById('btnMenu').addEventListener('click',()=>{const menuContent='<div class="menu-item" onclick="abrirMenuSeguranca();fecharModal()"><i class="fas fa-shield-alt"></i> Segurança</div><div class="menu-item" onclick="abrirMenuRelatorio();fecharModal()"><i class="fas fa-chart-line"></i> Relatório</div><div class="menu-item" onclick="abrirMenuPosicaoFab();fecharModal()"><i class="fas fa-arrows-alt"></i> Posição Botão</div>';abrirModal('Menu','fa-bars',menuContent)});document.querySelectorAll('.filter-btn').forEach(btn=>{btn.addEventListener('click',function(){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active');App.currentFilter=this.dataset.filter;mostrarConteudo()})});const fabMain=document.getElementById('fabMain');const fabContainer=document.getElementById('fabContainer');fabMain.addEventListener('click',()=>{fabContainer.classList.toggle('open')});document.addEventListener('click',(e)=>{if(!fabContainer.contains(e.target)){fabContainer.classList.remove('open')}});['loginEmail','loginPassword','registerName','registerEmail','registerPassword'].forEach(id=>{const input=document.getElementById(id);if(input){input.addEventListener('keypress',(e)=>{if(e.key==='Enter'){if(id.includes('login')){document.getElementById('btnLogin').click()}else if(id.includes('register')){document.getElementById('btnRegister').click()}}})}});document.getElementById('modalOverlay').addEventListener('click',(e)=>{if(e.target===e.currentTarget){fecharModal()}});inicializarFabMovel()}catch(error){console.error('Erro na inicialização:',error);showToast('Erro ao iniciar aplicativo: '+error.message,'error')}}document.addEventListener('DOMContentLoaded',init)</script></body></html>
