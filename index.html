window.openRelatorioModal=function(){const hoje=new Date(),targetDate=new Date(hoje.getFullYear(),hoje.getMonth()+app.currentMonthOffset,1),mes=targetDate.getMonth()+1,ano=targetDate.getFullYear();const modalHTML=`<div class="modal-header"><div class="modal-title"><i class="fas fa-chart-bar"></i> Relatório e Histórico</div><button class="close-modal" onclick="closeModalWithCheck()">&times;</button></div><div style="padding:16px"><div style="text-align:center;margin-bottom:20px;border-bottom:2px solid #eee;padding-bottom:12px"><div style="font-size:1.2em;font-weight:700;color:var(--dark);margin-bottom:5px">Relatório Financeiro</div><div style="color:var(--gray);font-size:.9em">Selecione o período</div></div><div class="form-group"><label class="form-label"><i class="fas fa-calendar"></i> Período</label><div style="display:flex;gap:8px"><select id="relatorioMes" class="form-select" style="flex:1" onchange="app.modalHasChanges=true">${MESES.map((n,i)=>`<option value="${i+1}" ${i+1===mes?'selected':''}>${n}</option>`).join('')}</select><input type="number" id="relatorioAno" class="form-input" value="${ano}" style="flex:1" oninput="app.modalHasChanges=true"></div></div><div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-primary" onclick="gerarRelatorio()" style="flex:1"><i class="fas fa-chart-bar"></i> Gerar Relatório</button><button class="btn btn-warning" onclick="verHistoricoCompleto()" style="flex:1"><i class="fas fa-history"></i> Ver Histórico</button><button class="btn" onclick="closeModalWithCheck()" style="flex:1;background:#95a5a6;color:#fff">Fechar</button></div></div>`;document.getElementById('modalContent').innerHTML=modalHTML;document.getElementById('modalOverlay').style.display='flex';app.modalHasChanges=false}
window.gerarRelatorio=async function(){const mes=parseInt(document.getElementById('relatorioMes').value),ano=parseInt(document.getElementById('relatorioAno').value);try{const[{data:contas},{data:gastos}]=await Promise.all([app.supabase.from('contas').select('*').eq('user_id',app.currentUser.id),app.supabase.from('gastos').select('*').eq('user_id',app.currentUser.id)]);const contasMes=filterContasPorMes(contas||[],mes,ano),gastosMes=filterGastosPorMes(gastos||[],mes,ano),totalContas=contasMes.reduce((s,c)=>s+c.valor_original,0),totalContasPagas=contasMes.reduce((s,c)=>s+(c.valor_pago||0),0),totalContasPendentes=contasMes.filter(c=>c.valor_pago===0&&c.status!=='concluida').reduce((s,c)=>s+c.valor_original,0),totalGastos=gastosMes.reduce((s,g)=>s+g.valor,0),saldoFinal=-totalContasPendentes-totalGastos,gastosPorCategoria={};gastosMes.forEach(g=>{if(!gastosPorCategoria[g.categoria])gastosPorCategoria[g.categoria]=0;gastosPorCategoria[g.categoria]+=g.valor});const contasPorUsuario={},gastosPorUsuario={},listaPorUsuario={};contasMes.forEach(c=>{const u=c.usuario_nome||'Sistema';contasPorUsuario[u]=(contasPorUsuario[u]||0)+c.valor_original});gastosMes.forEach(g=>{const u=g.usuario_nome||'Sistema';gastosPorUsuario[u]=(gastosPorUsuario[u]||0)+g.valor});const{data:lista}=await app.supabase.from('lista_compras').select('*').eq('user_id',app.currentUser.id);(lista||[]).forEach(i=>{const u=i.usuario_nome||'Sistema';listaPorUsuario[u]=(listaPorUsuario[u]||0)+1});const modalHTML=`<div class="modal-header"><div class="modal-title"><i class="fas fa-chart-bar"></i> Relatório - ${getNomeMes(mes)}/${ano}</div><button class="close-modal" onclick="closeModalWithCheck()">&times;</button></div><div style="padding:16px;max-height:70vh;overflow-y:auto"><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px"><div style="background:#f8f9fa;padding:12px;border-radius:8px;text-align:center;border-left:4px solid var(--purple)"><div style="color:var(--gray);font-size:.85em">Contas Total</div><div style="font-size:1.2em;font-weight:700;margin:5px 0">${formatCurrency(totalContas)}</div><div style="font-size:.8em;color:var(--gray)">${contasMes.length} conta(s)</div></div><div style="background:#f8f9fa;padding:12px;border-radius:8px;text-align:center;border-left:4px solid var(--success)"><div style="color:var(--gray);font-size:.85em">Contas Pagas</div><div style="font-size:1.2em;font-weight:700;margin:5px 0">${formatCurrency(totalContasPagas)}</div><div style="font-size:.8em;color:var(--gray)">${contasMes.filter(c=>c.valor_pago>0).length} conta(s)</div></div><div style="background:#f8f9fa;padding:12px;border-radius:8px;text-align:center;border-left:4px solid var(--warning)"><div style="color:var(--gray);font-size:.85em">Contas Pendentes</div><div style="font-size:1.2em;font-weight:700;margin:5px 0">${formatCurrency(totalContasPendentes)}</div><div style="font-size:.8em;color:var(--gray)">${contasMes.filter(c=>c.valor_pago===0&&c.status!=='concluida').length} conta(s)</div></div><div style="background:#f8f9fa;padding:12px;border-radius:8px;text-align:center;border-left:4px solid var(--gasto)"><div style="color:var(--gray);font-size:.85em">Total Gastos</div><div style="font-size:1.2em;font-weight:700;margin:5px 0">${formatCurrency(totalGastos)}</div><div style="font-size:.8em;color:var(--gray)">${gastosMes.length} gasto(s)</div></div></div><div style="margin-bottom:20px"><div style="font-weight:700;font-size:1em;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid #eee">Gastos por Categoria</div>${Object.entries(gastosPorCategoria).map(([c,v])=>{const ci=CATEGORIAS_GASTOS.find(cat=>cat.id===c)||CATEGORIAS_GASTOS[5],p=totalGastos>0?((v/totalGastos)*100).toFixed(1):'0';return`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #eee"><div><i class="fas ${ci.icon}"></i> ${ci.nome}</div><div><strong>${formatCurrency(v)}</strong><span style="color:var(--gray);font-size:.85em;margin-left: window.verHistoricoCompleto=async function(){try{await loadHistorico();const modalHTML=`<div class="modal-header"><div class="modal-title"><i class="fas fa-history"></i> Histórico Completo</div><button class="close-modal" onclick="closeModal()">&times;</button></div><div style="padding:16px"><div style="font-weight:700;font-size:1em;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid #eee">Últimas 100 atividades</div><div style="max-height:400px;overflow-y:auto">${app.historico.map(i=>`<div style="padding:10px;border-bottom:1px solid #f0f0f0;font-size:.85em"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><i class="fas ${i.tipo==='criado'?'fa-plus-circle':i.tipo==='editado'?'fa-edit':'fa-trash'}" style="color:${i.tipo==='criado'?'var(--success)':i.tipo==='editado'?'var(--warning)':'var(--danger)'}"></i><strong>${i.descricao}</strong></div><div style="color:var(--gray);font-size:.8em;display:flex;justify-content:space-between"><span><span class="usuario-badge" style="margin-left:0">${i.usuario_avatar||'👤'} ${i.usuario_nome||'Sistema'}</span></span><span>${formatDate(i.data)}</span></div></div>`).join('')||'<div style="text-align:center;padding:40px;color:var(--gray)">Nenhum histórico encontrado</div>'}</div><div style="display:flex;gap:8px;margin-top:20px"><button class="btn" onclick="closeModal()" style="flex:1;background:#95a5a6;color:#fff">Fechar</button></div></div>`;document.getElementById('modalContent').innerHTML=modalHTML;app.modalHasChanges=false}catch(error){console.error('Erro:',error);alert('Erro ao carregar histórico: '+error.message)}}
window.imprimirRelatorio=function(){const printContent=document.getElementById('modalContent').innerHTML;const w=window.open('','_blank');w.document.write(`<!DOCTYPE html><html><head><title>Relatório Home Life</title><style>body{font-family:Arial,sans-serif;margin:20px;color:#333;font-size:12px}@media print{body{margin:10px}button{display:none}}</style></head><body>${printContent}</body></html>`);w.document.close();setTimeout(()=>w.print(),500)}
window.openMenuModal=function(){const modalHTML=`<div class="modal-header"><div class="modal-title"><i class="fas fa-bars"></i> Menu</div><button class="close-modal" onclick="closeModal()">&times;</button></div><div style="padding:16px"><div class="menu-item" onclick="openManualModal()"><i class="fas fa-book"></i><span>Manual de Uso</span></div><div class="menu-item" onclick="openEditarUsuarioModal()"><i class="fas fa-user-edit"></i><span>Meu Perfil</span></div></div>`;document.getElementById('modalContent').innerHTML=modalHTML;document.getElementById('modalOverlay').style.display='flex'}
window.openManualModal=function(){const modalHTML=`<div class="modal-header"><div class="modal-title"><i class="fas fa-book"></i> Manual de Uso</div><button class="close-modal" onclick="closeModal()">&times;</button></div><div style="padding:16px;max-height:400px;overflow-y:auto"><div style="margin-bottom:20px"><h3 style="color:var(--purple);margin-bottom:10px">📱 Como usar o Home Life</h3><p style="margin-bottom:12px">Gestor doméstico completo para organizar sua vida financeira e compromissos.</p></div><div style="margin-bottom:20px"><h4 style="color:var(--dark);margin-bottom:8px"><i class="fas fa-user"></i> Perfil do Usuário</h4><ul style="padding-left:20px;margin-bottom:12px"><li>Clique no seu nome/avatar no cabeçalho para editar seu perfil</li><li>Escolha avatar, cor e senha de 4 dígitos para os saldos</li><li>Cada usuário tem seu próprio identificador nos registros</li></ul></div><div style="margin-bottom:20px"><h4 style="color:var(--dark);margin-bottom:8px"><i class="fas fa-file-invoice-dollar"></i> Contas</h4><ul style="padding-left:20px;margin-bottom:12px"><li>Adicione contas únicas ou recorrentes</li><li>Contas recorrentes são numeradas automaticamente</li></ul></div><div style="margin-bottom:20px"><h4 style="color:var(--dark);margin-bottom:8px"><i class="fas fa-calendar-alt"></i> Eventos</h4><ul style="padding-left:20px;margin-bottom:12px"><li><i class="fas fa-star"></i> Normais</li><li><i class="fas fa-redo"></i> Rotinas (recorrentes)</li><li><i class="fas fa-heart"></i> Datas especiais</li></ul></div><div style="margin-bottom:20px"><h4 style="color:var(--dark);margin-bottom:8px"><i class="fas fa-wallet"></i> Saldos</h4><ul style="padding-left:20px;margin-bottom:12px"><li>Protegido por senha de 4 dígitos (configurável no perfil)</li><li>Ao clicar no botão Saldos, digite sua senha para acessar</li></ul></div><div style="background:#f8f9fa;padding:12px;border-radius:8px;border-left:4px solid var(--purple)"><strong>Dica:</strong> Use "Hoje" no cabeçalho para voltar rapidamente à data atual.</div></div>`;document.getElementById('modalContent').innerHTML=modalHTML}
window.goToToday=function(){app.currentMonthOffset=0;app.selectedDay=null;desmarcarFiltros();loadAppData()}
window.closeModalWithCheck=function(){if(app.modalHasChanges){if(confirm('Tem certeza que deseja fechar? As alterações não salvas serão perdidas.'))closeModal()}else closeModal()}
window.closeModal=function(){document.getElementById('modalOverlay').style.display='none';app.modalHasChanges=false}
document.addEventListener('DOMContentLoaded',initApp);
</script></body></html>
