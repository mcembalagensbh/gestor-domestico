                const {data:saldo,error}=await app.supabase.from('saldos').select('*').eq('id',id).single();
                if(error) throw error;
                const modalHTML=`<div class="modal-header"><div class="modal-title"><i class="fas fa-edit"></i> Editar Saldo</div><button class="close-modal" onclick="closeModalWithCheck()">&times;</button></div><div style="padding:16px;"><div class="form-group"><label class="form-label"><i class="fas fa-tag"></i> Nome do Saldo</label><input type="text" id="editarSaldoNome" class="form-input" value="${saldo.nome}" oninput="app.modalHasChanges=true"></div><div class="form-group"><label class="form-label"><i class="fas fa-money-bill-wave"></i> Valor</label><input type="text" id="editarSaldoValor" class="form-input" value="${saldo.valor.toFixed(2).replace('.',',')}" oninput="app.modalHasChanges=true"></div><div style="display:flex;gap:8px;margin-top:16px;"><button class="btn btn-primary" onclick="saveEditarSaldo('${saldo.id}')" style="flex:1;"><i class="fas fa-save"></i> Salvar</button><button class="btn btn-danger" onclick="deleteSaldo('${saldo.id}')" style="flex:1;"><i class="fas fa-trash"></i> Excluir</button><button class="btn" onclick="closeModalWithCheck()" style="flex:1;background:#95a5a6;color:white;">Cancelar</button></div></div>`;
                document.getElementById('modalContent').innerHTML=modalHTML;
                document.getElementById('modalOverlay').style.display='flex';
                app.modalHasChanges=false;
            }catch(error){console.error('Erro ao abrir modal de edição de saldo:',error);alert('Erro ao carregar dados do saldo.');}
        };
        
        window.saveEditarSaldo=async function(id){
            const n=document.getElementById('editarSaldoNome').value.trim(),v=parseCurrency(document.getElementById('editarSaldoValor').value);
            if(!n||!v){alert('Preencha nome e valor');return;}
            try{
                const {error}=await app.supabase.from('saldos').update({nome:n,valor:v,data:new Date().toISOString().split('T')[0],atualizado_em:new Date().toISOString()}).eq('id',id);
                if(error) throw error;
                await addToHistorico('editado',`Saldo editado: ${n} - ${formatCurrency(v)}`);
                alert('✅ Saldo atualizado com sucesso!');closeModal();loadAppData();
            }catch(error){console.error('Erro ao atualizar saldo:',error);alert('❌ Erro: '+error.message);}
        };
        
        window.deleteSaldo=async function(id){
            if(!confirm('Tem certeza que deseja excluir este saldo?')) return;
            try{
                const {data:saldo}=await app.supabase.from('saldos').select('*').eq('id',id).single();
                const {error}=await app.supabase.from('saldos').delete().eq('id',id);
                if(error) throw error;
                await addToHistorico('deletado',`Saldo excluído: ${saldo.nome} - ${formatCurrency(saldo.valor)}`);
                alert('✅ Saldo excluído com sucesso!');closeModal();loadAppData();
            }catch(error){console.error('Erro ao excluir saldo:',error);alert('❌ Erro: '+error.message);}
        };
        
        window.openNovoItemModal=function(){
            const modalHTML=`<div class="modal-header"><div class="modal-title"><i class="fas fa-cart-plus"></i> Novo Item</div><button class="close-modal" onclick="closeModalWithCheck()">&times;</button></div><div style="padding:16px;"><div class="form-group"><label class="form-label"><i class="fas fa-hashtag"></i> Quantidade</label><input type="number" id="itemQuantidade" class="form-input" min="1" value="1" oninput="app.modalHasChanges=true"></div><div class="form-group"><label class="form-label"><i class="fas fa-box"></i> Item</label><input type="text" id="itemDescricao" class="form-input" placeholder="Ex: Leite, Pão, Arroz" oninput="app.modalHasChanges=true"></div><div style="display:flex;gap:8px;margin-top:16px;"><button class="btn btn-primary" onclick="saveNovoItem()" style="flex:1;"><i class="fas fa-save"></i> Adicionar</button><button class="btn" onclick="closeModalWithCheck()" style="flex:1;background:#95a5a6;color:white;">Cancelar</button></div></div>`;
            document.getElementById('modalContent').innerHTML=modalHTML;
            document.getElementById('modalOverlay').style.display='flex';
            app.modalHasChanges=false;
        };
        
        window.saveNovoItem=async function(){
            const q=parseInt(document.getElementById('itemQuantidade').value),d=document.getElementById('itemDescricao').value.trim();
            if(!q||!d){alert('Preencha quantidade e descrição');return;}
            try{
                const {error}=await app.supabase.from('lista_compras').insert({user_id:app.currentUser.id,quantidade:q,descricao:d,comprado:false,added_by:app.currentUser.email.split('@')[0],criado_em:new Date().toISOString()});
                if(error) throw error;
                await addToHistorico('criado',`Item adicionado à lista: ${q}x ${d}`);
                alert('✅ Item adicionado à lista!');closeModal();loadAppData();
            }catch(error){console.error('Erro ao adicionar item:',error);alert('❌ Erro: '+error.message);}
        };
        
        window.openNovoSaldoModal=function(){
            if(!app.saldoAuthenticated){if(!confirm('Para cadastrar saldos é necessário autenticação. Deseja autenticar agora?')) return;if(!authenticateSaldos()) return;}
            const modalHTML=`<div class="modal-header"><div class="modal-title"><i class="fas fa-wallet"></i> Novo Saldo</div><button class="close-modal" onclick="closeModalWithCheck()">&times;</button></div><div style="padding:16px;"><div class="form-group"><label class="form-label"><i class="fas fa-tag"></i> Nome do Saldo</label><input type="text" id="saldoNome" class="form-input" placeholder="Ex: Saldo Hugo, Saldo Casa, Poupança" oninput="app.modalHasChanges=true"></div><div class="form-group"><label class="form-label"><i class="fas fa-money-bill-wave"></i> Valor</label><input type="text" id="saldoValor" class="form-input" placeholder="0,00" oninput="app.modalHasChanges=true"></div><div style="display:flex;gap:8px;margin-top:16px;"><button class="btn btn-primary" onclick="saveNovoSaldo()" style="flex:1;"><i class="fas fa-save"></i> Salvar</button><button class="btn" onclick="closeModalWithCheck()" style="flex:1;background:#95a5a6;color:white;">Cancelar</button></div></div>`;
            document.getElementById('modalContent').innerHTML=modalHTML;
            document.getElementById('modalOverlay').style.display='flex';
            app.modalHasChanges=false;
        };
        
        window.saveNovoSaldo=async function(){
            const n=document.getElementById('saldoNome').value.trim(),v=parseCurrency(document.getElementById('saldoValor').value);
            if(!n||!v){alert('Preencha nome e valor');return;}
            try{
                const {error}=await app.supabase.from('saldos').insert({user_id:app.currentUser.id,nome:n,valor:v,data:new Date().toISOString().split('T')[0],added_by:app.currentUser.email.split('@')[0],criado_em:new Date().toISOString()});
                if(error) throw error;
                await addToHistorico('criado',`Saldo cadastrado: ${n} - ${formatCurrency(v)}`);
                alert('✅ Saldo salvo com sucesso!');closeModal();loadAppData();
            }catch(error){console.error('Erro ao salvar saldo:',error);alert('❌ Erro: '+error.message);}
        };
        
        window.openRelatorioModal=async function(){
            const hoje=new Date(),targetDate=new Date(hoje.getFullYear(),hoje.getMonth()+app.currentMonthOffset,1),mes=targetDate.getMonth()+1,ano=targetDate.getFullYear();
            const modalHTML=`<div class="modal-header"><div class="modal-title"><i class="fas fa-chart-bar"></i> Relatório e Histórico</div><button class="close-modal" onclick="closeModalWithCheck()">&times;</button></div><div style="padding:16px;"><div style="text-align:center;margin-bottom:20px;border-bottom:2px solid #eee;padding-bottom:12px;"><div style="font-size:1.2em;font-weight:bold;color:var(--dark);margin-bottom:5px;">Relatório Financeiro</div><div style="color:var(--gray);font-size:0.9em;">Selecione o período</div></div><div class="form-group"><label class="form-label"><i class="fas fa-calendar"></i> Período</label><div style="display:flex;gap:8px;"><select id="relatorioMes" class="form-select" style="flex:1;" onchange="app.modalHasChanges=true">${MESES.map((n,i)=>`<option value="${i+1}" ${i+1===mes?'selected':''}>${n}</option>`).join('')}</select><input type="number" id="relatorioAno" class="form-input" value="${ano}" style="flex:1;" oninput="app.modalHasChanges=true"></div></div><div style="display:flex;gap:8px;margin-top:16px;"><button class="btn btn-primary" onclick="gerarRelatorio()" style="flex:1;"><i class="fas fa-chart-bar"></i> Gerar Relatório</button><button class="btn btn-warning" onclick="verHistoricoCompleto()" style="flex:1;"><i class="fas fa-history"></i> Ver Histórico</button><button class="btn" onclick="closeModalWithCheck()" style="flex:1;background:#95a5a6;color:white;">Fechar</button></div></div>`;
            document.getElementById('modalContent').innerHTML=modalHTML;
            document.getElementById('modalOverlay').style.display='flex';
            app.modalHasChanges=false;
        };
        
        window.gerarRelatorio=async function(){
            const mes=parseInt(document.getElementById('relatorioMes').value),ano=parseInt(document.getElementById('relatorioAno').value);
            try{
                const [{data:contas},{data:gastos}]=await Promise.all([app.supabase.from('contas').select('*').eq('user_id',app.currentUser.id),app.supabase.from('gastos').select('*').eq('user_id',app.currentUser.id)]);
                const contasMes=filterContasPorMes(contas||[],mes,ano);
                const gastosMes=filterGastosPorMes(gastos||[],mes,ano);
                const totalContas=contasMes.reduce((s,c)=>s+c.valor_original,0);
                const totalContasPagas=contasMes.reduce((s,c)=>s+(c.valor_pago||0),0);
                const totalContasPendentes=contasMes.filter(c=>c.valor_pago===0&&c.status!=='concluida').reduce((s,c)=>s+c.valor_original,0);
                const totalGastos=gastosMes.reduce((s,g)=>s+g.valor,0);
                const saldoFinal=-totalContasPendentes-totalGastos;
                const gastosPorCategoria={};
                gastosMes.forEach(g=>{if(!gastosPorCategoria[g.categoria]) gastosPorCategoria[g.categoria]=0;gastosPorCategoria[g.categoria]+=g.valor;});
                const modalHTML=`<div class="modal-header"><div class="modal-title"><i class="fas fa-chart-bar"></i> Relatório - ${getNomeMes(mes)}/${ano}</div><button class="close-modal" onclick="closeModalWithCheck()">&times;</button></div><div style="padding:16px;"><div style="text-align:center;margin-bottom:20px;border-bottom:2px solid #eee;padding-bottom:12px;"><div style="font-size:1.2em;font-weight:bold;color:var(--dark);margin-bottom:5px;">Relatório Financeiro</div><div style="color:var(--gray);font-size:0.9em;">${getNomeMes(mes)}/${ano}</div></div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;"><div style="background:#f8f9fa;padding:12px;border-radius:8px;text-align:center;border-left:4px solid var(--purple);"><div style="color:var(--gray);font-size:0.85em;">Contas Total</div><div style="font-size:1.2em;font-weight:bold;margin:5px 0;">${formatCurrency(totalContas)}</div><div style="font-size:0.8em;color:var(--gray);">${contasMes.length} conta(s)</div></div><div style="background:#f8f9fa;padding:12px;border-radius:8px;text-align:center;border-left:4px solid var(--success);"><div style="color:var(--gray);font-size:0.85em;">Contas Pagas</div><div style="font-size:1.2em;font-weight:bold;margin:5px 0;">${formatCurrency(totalContasPagas)}</div><div style="font-size:0.8em;color:var(--gray);">${contasMes.filter(c=>c.valor_pago>0).length} conta(s)</div></div><div style="background:#f8f9fa;padding:12px;border-radius:8px;text-align:center;border-left:4px solid var(--warning);"><div style="color:var(--gray);font-size:0.85em;">Contas Pendentes</div><div style="font-size:1.2em;font-weight:bold;margin:5px 0;">${formatCurrency(totalContasPendentes)}</div><div style="font-size:0.8em;color:var(--gray);">${contasMes.filter(c=>c.valor_pago===0&&c.status!=='concluida').length} conta(s)</div></div><div style="background:#f8f9fa;padding:12px;border-radius:8px;text-align:center;border-left:4px solid var(--gasto);"><div style="color:var(--gray);font-size:0.85em;">Total Gastos</div><div style="font-size:1.2em;font-weight:bold;margin:5px 0;">${formatCurrency(totalGastos)}</div><div style="font-size:0.8em;color:var(--gray);">${gastosMes.length} gasto(s)</div></div></div><div style="margin-bottom:20px;"><div style="font-weight:bold;font-size:1em;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid #eee;">Gastos por Categoria</div>${Object.entries(gastosPorCategoria).map(([c,v])=>{const ci=CATEGORIAS_GASTOS.find(cat=>cat.id===c)||CATEGORIAS_GASTOS[5];const p=totalGastos>0?((v/totalGastos)*100).toFixed(1):'0';return`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #eee;"><div><i class="fas ${ci.icon}"></i> ${ci.nome}</div><div><strong>${formatCurrency(v)}</strong><span style="color:var(--gray);font-size:0.85em;margin-left:8px;">${p}%</span></div></div>`;}).join('')}</div><div style="margin-bottom:20px;"><div style="font-weight:bold;font-size:1em;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid #eee;">Resumo Financeiro</div><div style="display:flex;justify-content:space-between;padding:10px;background:#f8f9fa;border-radius:8px;margin-bottom:10px;"><div>Saldo Final Estimado:</div><div style="font-weight:bold;color:${saldoFinal<0?'var(--danger)':'var(--success)'}">${formatCurrency(saldoFinal)}</div></div></div><div style="display:flex;gap:8px;margin-top:20px;"><button class="btn btn-primary" onclick="imprimirRelatorio()" style="flex:1;"><i class="fas fa-print"></i> Imprimir Relatório</button><button class="btn" onclick="closeModalWithCheck()" style="flex:1;background:#95a5a6;color:white;">Fechar</button></div></div>`;
                document.getElementById('modalContent').innerHTML=modalHTML;
                app.modalHasChanges=false;
            }catch(error){console.error('Erro ao gerar relatório:',error);alert('Erro ao gerar relatório: '+error.message);}
        };
        
        window.verHistoricoCompleto=async function(){
            try{
                await loadHistorico();
                const modalHTML=`<div class="modal-header"><div class="modal-title"><i class="fas fa-history"></i> Histórico Completo</div><button class="close-modal" onclick="closeModal()">&times;</button></div><div style="padding:16px;"><div style="font-weight:bold;font-size:1em;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid #eee;">Últimas 100 atividades</div><div style="max-height:400px;overflow-y:auto;">${app.historico.map(i=>`<div style="padding:10px;border-bottom:1px solid #f0f0f0;font-size:0.85em;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><i class="fas ${i.tipo==='criado'?'fa-plus-circle':i.tipo==='editado'?'fa-edit':'fa-trash'}" style="color:${i.tipo==='criado'?'var(--success)':i.tipo==='editado'?'var(--warning)':'var(--danger)'};"></i><strong>${i.descricao}</strong></div><div style="color:var(--gray);font-size:0.8em;display:flex;justify-content:space-between;"><span>${i.added_by||'Sistema'}</span><span>${formatDate(i.data)}</span></div></div>`).join('')||'<div style="text-align:center;padding:40px;color:var(--gray);">Nenhum histórico encontrado</div>'}</div><div style="display:flex;gap:8px;margin-top:20px;"><button class="btn" onclick="closeModal()" style="flex:1;background:#95a5a6;color:white;">Fechar</button></div></div>`;
                document.getElementById('modalContent').innerHTML=modalHTML;
                app.modalHasChanges=false;
            }catch(error){console.error('Erro ao carregar histórico:',error);alert('Erro ao carregar histórico: '+error.message);}
        };
        
        window.imprimirRelatorio=function(){
            const printContent=document.getElementById('modalContent').innerHTML;
            const printWindow=window.open('','_blank');
            printWindow.document.write(`<!DOCTYPE html><html><head><title>Relatório Financeiro - Home Life</title><style>body{font-family:Arial,sans-serif;margin:20px;color:#333;font-size:12px;}@media print{body{margin:10px;}button{display:none;}}</style></head><body>${printContent}</body></html>`);
            printWindow.document.close();
            setTimeout(()=>{printWindow.print();},500);
        };
        
        window.toggleItemSelecionado=function(id){
            const i=app.listaSelecionados.indexOf(id);
            if(i===-1) app.listaSelecionados.push(id);
            else app.listaSelecionados.splice(i,1);
            showContent();
        };
        
        window.toggleItemComprado=async function(id,c){
            try{
                const {data:item}=await app.supabase.from('lista_compras').select('*').eq('id',id).single();
                const ns=!c;
                const {error}=await app.supabase.from('lista_compras').update({comprado:ns,comprado_em:ns?new Date().toISOString():null,atualizado_em:new Date().toISOString()}).eq('id',id);
                if(error) throw error;
                await addToHistorico('editado',`Item ${ns?'marcado como comprado':'desmarcado'}: ${item.quantidade}x ${item.descricao}`);
                loadAppData();
            }catch(error){console.error('Erro ao atualizar item:',error);}
        };
        
        window.deleteSelectedItems=async function(){
            if(app.listaSelecionados.length===0){alert('Nenhum item selecionado para deletar');return;}
            if(!confirm(`Tem certeza que deseja deletar ${app.listaSelecionados.length} item(ns) selecionado(s)?`)) return;
            try{
                const {data:items}=await app.supabase.from('lista_compras').select('*').in('id',app.listaSelecionados);
                const {error}=await app.supabase.from('lista_compras').delete().in('id',app.listaSelecionados);
                if(error) throw error;
                for(const i of items) await addToHistorico('deletado',`Item deletado da lista: ${i.quantidade}x ${i.descricao}`);
                app.listaSelecionados=[];
                alert('✅ Itens deletados com sucesso!');
                loadAppData();
            }catch(error){console.error('Erro ao deletar itens:',error);alert('❌ Erro: '+error.message);}
        };
        
        window.closeModalWithCheck=function(){
            if(app.modalHasChanges){if(confirm('Tem certeza que deseja fechar? As alterações não salvas serão perdidas.')) closeModal();}
            else closeModal();
        };
        
        window.closeModal=function(){
            document.getElementById('modalOverlay').style.display='none';
            app.modalHasChanges=false;
        };
        
        document.addEventListener('DOMContentLoaded',initApp);
    </script>
</body>
</html>
